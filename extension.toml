# MCP server for Zed's agent: tokenburn_usage, tokenburn_report, tokenburn_chart,
# tokenburn_breakdown, tokenburn_budgets. Settings: `context_servers.tokenburn`.
[context_servers.tokenburn]

# The native `tokenburn-zed` binary comes from this repository's GitHub releases
# (unless it is on PATH or configured in the settings).
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["sorinirimies", "zed-tokenburn", "**"]
