id = "tokenburn"
name = "TokenBurn"
description = "Live AI token and cost usage in Zed's status bar — pi, Zed, Claude Code, Codex, Copilot CLI, Gemini CLI, OpenCode, Amp, Cline, Roo, Kilo, Qwen. Budgets, alerts, charts, MCP tools. Local logs only."
version = "0.1.0"
schema_version = 1
authors = ["Sorin Irimies <sorinirimies@gmail.com>"]
repository = "https://github.com/sorinirimies/zed-tokenburn"

# The language server never looks at your code: Zed shows a language server's
# progress in the status bar, and that is where the live counter lives. It is
# registered for as many languages as possible so it runs whatever file is open
# (unknown names are ignored by Zed). Settings: `lsp.tokenburn` in settings.json.
[language_servers.tokenburn]
name = "TokenBurn"
