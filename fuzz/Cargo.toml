[package]
name = "tokenburn-zed-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chrono = "0.4"
serde_json = "1"
tokenburn-zed = { path = "../crates/tokenburn-zed" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "settings_json"
path = "fuzz_targets/settings_json.rs"
test = false
doc = false

[[bin]]
name = "mcp_message"
path = "fuzz_targets/mcp_message.rs"
test = false
doc = false

[[bin]]
name = "file_uri"
path = "fuzz_targets/file_uri.rs"
test = false
doc = false

[[bin]]
name = "chart_render"
path = "fuzz_targets/chart_render.rs"
test = false
doc = false
