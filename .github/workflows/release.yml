name: Release

# Push a vX.Y.Z tag (`just release X.Y.Z`): validate tag == Cargo.toml → gate →
# build `tokenburn-zed` for macOS (arm64, x86-64), Linux (static musl arm64, x86-64)
# and Windows → GitHub release with the archives + sha256 and git-cliff notes →
# crates.io (only if the CRATES_IO_TOKEN secret is set; idempotent).
#
# The Zed extensions themselves are published by a PR to zed-industries/extensions
# (docs/publishing.md); Zed builds the wasm from the tagged source.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Validate tag
        id: v
        run: nu scripts/ci/validate_tag.nu "${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Versions match the tag
        run: nu scripts/ci/check_versions.nu "${{ steps.v.outputs.tag }}"

  gate:
    name: Quality gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: wasm32-wasip2
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - run: nu scripts/ci/quality_gate.nu

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      # Static Linux binaries for both architectures from one runner: zig is the
      # C cross-compiler for the bundled sqlite and zstd.
      - name: Install zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build (zig)
        if: matrix.zig
        run: cargo zigbuild --release --locked -p tokenburn-zed --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p tokenburn-zed --target ${{ matrix.target }}
      - name: Package
        run: nu scripts/ci/package.nu ${{ matrix.target }} --out dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tokenburn-zed-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        run: nu scripts/ci/release_notes.nu ${{ needs.validate.outputs.tag }}
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: TokenBurn for Zed ${{ needs.validate.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*

  crates-io:
    name: crates.io
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      # Multi-crate workspace: one line per crate, dependencies first.
      - name: Publish tokenburn-zed (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nu scripts/ci/publish_crate.nu tokenburn-zed
