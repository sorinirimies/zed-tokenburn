# ──────────────────────────────────────────────────────────────────────────────
# Auto-merge — merge Dependabot PRs once CI is green
# ──────────────────────────────────────────────────────────────────────────────
# Dependabot bumps GitHub Actions and Cargo dependencies (.github/dependabot.yml);
# in-range Cargo updates also land nightly via deps-update.yml.
#
# Runs after CI finished successfully on a Dependabot PR, so no branch
# protection or "Allow auto-merge" setting is needed — and direct pushes to main
# (yours, the nightly) stay unblocked. scripts/ci/auto_merge.nu leaves majors
# (1.x → 2.x) for a human and squash-merges everything else.
#
# Merges made with GITHUB_TOKEN don't trigger new workflow runs; the PR's CI
# already ran on the rebased branch.
# ──────────────────────────────────────────────────────────────────────────────

name: Auto-merge Dependabot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      # The default branch's scripts, never the PR's.
      - uses: actions/checkout@v7
      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Merge unless it is a major bump
        run: nu scripts/ci/auto_merge.nu "$BRANCH" "$SHA"
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
