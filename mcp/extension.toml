id = "tokenburn-mcp-server"
name = "TokenBurn MCP Server"
description = "Read-only AI token and cost usage tools for Zed's agent — pi, Zed, Claude Code, Codex, Copilot CLI, Gemini CLI, OpenCode, Amp, Cline, Roo, Kilo, Qwen. Local logs only."
version = "0.1.2"
schema_version = 1
authors = ["Sorin Irimies <sorinirimies@gmail.com>"]
repository = "https://github.com/sorinirimies/zed-tokenburn"

# tokenburn_usage, tokenburn_report, tokenburn_chart, tokenburn_breakdown,
# tokenburn_budgets. Settings: `context_servers.tokenburn.settings`.
[context_servers.tokenburn]

# The native `tokenburn-zed` binary comes from this repository's GitHub releases
# (unless `binary_path` is set).
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["sorinirimies", "zed-tokenburn", "**"]
