# The repository root is two things at once:
#
# * the status-bar Zed extension (`tokenburn`, package `zed-tokenburn`, compiled to
#   `wasm32-wasip2` by Zed from this directory — Zed only reads `extension.toml`
#   and this package), and
# * the workspace root, so the MCP server extension (`mcp/`, id
#   `tokenburn-mcp-server`) and the native companion `tokenburn-zed` (language
#   server + MCP server, reusing `tokenburn-core`) share one lockfile and version.
#
# `cargo build` here builds only the extension (`default-members`); use
# `cargo build -p tokenburn-zed` (or `just build-server`) for the native binary.

[package]
name = "zed-tokenburn"
description = "Zed extension: live AI token and cost usage in Zed's status bar (TokenBurn)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = { workspace = true }
serde_json = { workspace = true }

[workspace]
members = [".", "mcp", "crates/tokenburn-zed"]
default-members = ["."]
resolver = "2"

[workspace.package]
version      = "0.1.1"
edition      = "2021"
rust-version = "1.90"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/zed-tokenburn"

[workspace.dependencies]
zed_extension_api = "0.7"
# Pinned exactly: core bumps change what the extension shows, so each one is a deliberate
# release (0.3.8/0.3.9 were published from an older branch with zstd 0.13: skip them).
tokenburn-core    = "=0.3.13"
anyhow            = "1"
chrono            = "0.4"
crossbeam-channel = "0.5"
dirs              = "7.0"
lsp-server        = "0.10"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tempfile          = "3"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
